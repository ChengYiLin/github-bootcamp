<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>待辦清單</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="card">
    <header class="card-header">
      <div class="header-row">
        <div>
          <p class="eyebrow">MY TO-DO LIST</p>
          <h1>待辦清單</h1>
        </div>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false">🌙 深色模式</button>
      </div>
      <p class="subtitle">把想做的事記下來，一步一步完成。</p>
    </header>

    <form id="todo-form" class="todo-form">
      <label class="sr-only" for="todo-input">新增待辦事項</label>
      <input id="todo-input" type="text" placeholder="今天想完成什麼？" autocomplete="off">
      <button class="add-button" type="submit">新增</button>
    </form>

    <div class="filters" role="group" aria-label="篩選待辦事項">
      <button class="filter-button" type="button" data-filter="all" aria-pressed="true">全部</button>
      <button class="filter-button" type="button" data-filter="active" aria-pressed="false">未完成</button>
      <button class="filter-button" type="button" data-filter="completed" aria-pressed="false">已完成</button>
    </div>

    <p id="theme-message" class="storage-message" role="alert" hidden></p>
    <p id="storage-message" class="storage-message" role="alert" hidden></p>
    <section class="list-section" aria-label="待辦事項">
      <p id="empty-message" class="empty-message">還沒有任何待辦事項,新增一個吧!</p>
      <ul id="todo-list" class="todo-list"></ul>
    </section>
    <footer class="card-footer">
      <span id="remaining-count" aria-live="polite">未完成:0 項</span>
    </footer>
  </main>
</body>
</html>
